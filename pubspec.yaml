name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Android Platform
        run: |
          flutter create . --platforms=android --org=com.shakil.stock
          sed -i 's/minSdkVersion = .*/minSdkVersion = 21/' android/app/build.gradle || true
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/' android/app/build.gradle || true

      - name: Add Internet Permission
        run: |
          sed -i '/<manifest/
